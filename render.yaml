services:
  - type: web
    name: scanner-factures
    runtime: static
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /sw.js
        name: Cache-Control
        value: no-cache
